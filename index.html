<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PDF Toolkit for merging and compressing PDF files in the browser." />
    <title>PDF Toolkit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.15.349/pdf.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <p class="eyebrow">Browser PDF utility</p>
        <h1>PDF Toolkit</h1>
      </header>

      <main class="card">
        <div class="mode-toggle" aria-label="Tool mode selector">
          <button class="mode-btn active" data-mode="merge" type="button">Merge PDFs</button>
          <button class="mode-btn" data-mode="reduce" type="button">Reduce PDF Size</button>
        </div>

        <section id="merge-panel" class="panel active">
          <div class="field-group">
            <label for="merge-input">Choose PDFs to merge</label>
            <input id="merge-input" type="file" accept="application/pdf" multiple />
          </div>

          <div class="file-summary">
            <span id="merge-file-count">0 file(s) selected</span>
            <button id="merge-download" class="secondary" type="button">Download merged PDF</button>
          </div>
        </section>

        <section id="reduce-panel" class="panel">
          <div class="field-group">
            <label for="reduce-input">Choose a PDF to compress</label>
            <input id="reduce-input" type="file" accept="application/pdf" />
          </div>

          <div class="field-group compact">
            <label for="quality">Compression level</label>
            <select id="quality">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <div class="file-summary">
            <span id="reduce-file-name">No file selected</span>
            <button id="reduce-download" class="secondary" type="button">Download reduced PDF</button>
          </div>
        </section>

        <div class="status-box" id="status-box">
          Ready to process your PDF files.
        </div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
